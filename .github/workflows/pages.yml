name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deploy read the repo and mint the Pages id-token it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing to build — the game runs from source. This just gathers the
      # files the browser actually asks for, leaving the tooling behind.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src styles vendor world _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
